apiVersion: apps/v1
kind: Deployment
metadata:
  name: solver-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solver-auth
  template:
    metadata:
      labels:
        app: solver-auth
    spec:
      containers:
        - name: solver-auth
          image: app  # placeholder, kustomize replaces this at deploy time
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: solver-auth-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"