apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solver-auth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["api.deckymart.com"]
      secretName: solver-auth-api-tls
  rules:
    - host: api.deckymart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solver-auth
                port:
                  number: 80